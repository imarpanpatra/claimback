# Render Blueprint: New > Blueprint, pick this repository, and fill in the
# secrets when asked. It creates two free services from the same repo:
#   claimback       an always-on static site that plays the recorded run
#   claimback-live  the Node server that runs live claims (sleeps when idle)
services:
  - type: web
    name: claimback
    runtime: static
    buildCommand: echo "No build step. public/ is served as is."
    staticPublishPath: public

  - type: web
    name: claimback-live
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANAKIN_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LIVE_RUN_CODE
        sync: false
